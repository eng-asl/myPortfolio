name: Deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture previous production sitemap
        run: curl -fsSL https://eng-asl.com/sitemap.xml -o prev-sitemap.xml || true
      - run: npm run validate:content
      - run: npm run build
      - name: Stage sitemaps for IndexNow
        run: |
          mkdir -p .indexnow-sitemaps
          [ -f prev-sitemap.xml ] && cp prev-sitemap.xml .indexnow-sitemaps/prev-sitemap.xml || true
          [ -f out/sitemap.xml ] && cp out/sitemap.xml .indexnow-sitemaps/sitemap.xml || true
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-sitemaps
          path: .indexnow-sitemaps/
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-sitemaps
          path: .indexnow-sitemaps
        continue-on-error: true
      - name: Notify IndexNow of changed canonical URLs
        env:
          BASE_REF: ${{ github.event.before || 'HEAD~1' }}
          HEAD_REF: ${{ github.sha }}
        run: |
          base_ref="$BASE_REF"
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="HEAD~1"
          fi
          git fetch --no-tags --depth=2 origin "$base_ref" || true
          args=(--mode source --base-ref "$base_ref" --head-ref "$HEAD_REF")
          if [ -f .indexnow-sitemaps/prev-sitemap.xml ]; then
            args+=(--prev-sitemap .indexnow-sitemaps/prev-sitemap.xml)
          fi
          if [ -f .indexnow-sitemaps/sitemap.xml ]; then
            args+=(--sitemap .indexnow-sitemaps/sitemap.xml)
          fi
          node scripts/indexnow-notify.mjs "${args[@]}"
